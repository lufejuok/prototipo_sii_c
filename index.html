<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Prototipo SII-CINDE · Versión C</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior fija + contenido centrado (máx. 1120px) + barra inferior con accesos rápidos. Tema claro fijo. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF4; --fg:#16213A; --muted:#536079; --line:#D3DAE6;
  --primary:#1E3257; --on-primary:#FFFFFF; --primary-soft:#E2E8F3;
  --topbar:#1E3257; --on-topbar:#FFFFFF; --accent:#C9661F;
  --ok:#1D7044; --ok-bg:#E1F2E8; --warn:#8A5200; --warn-bg:#FFF0D2; --bad:#B42318; --bad-bg:#FDE7E4; --info:#1F5FA8; --info-bg:#E4EDFA;
  --overlay:rgba(15,23,40,.55);
  --f-display:'Lexend', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --r:10px; color-scheme:light;
}
body{ background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:1rem; line-height:1.5; }
html{ scroll-padding-top:84px; scroll-padding-bottom:84px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }
*{ box-sizing:border-box; }
h1,h2,h3{ font-family:var(--f-display); line-height:1.2; text-wrap:balance; margin:0; color:var(--fg); }
h1{ font-size:1.75rem; font-weight:600; }
h2{ font-size:1.2rem; font-weight:600; }
h3{ font-size:1rem; font-weight:600; }
p{ margin:0; }
button, input, select, textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip{ position:absolute; left:1rem; top:-3rem; background:var(--primary); color:var(--on-primary); padding:.5rem 1rem; border-radius:8px; z-index:100; }
.skip:focus{ top:.5rem; }
svg.i{ width:1.25em; height:1.25em; flex:none; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* Barra superior */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--topbar); color:var(--on-topbar);
  display:flex; align-items:center; gap:.5rem; padding:.5rem 1rem; min-height:64px; }
.tb-btn{ display:inline-flex; align-items:center; gap:.45rem; background:transparent; border:1px solid transparent; color:var(--on-topbar);
  padding:.5rem .65rem; border-radius:8px; cursor:pointer; min-height:44px; font-weight:700; }
.tb-btn:hover{ background:rgba(255,255,255,.1); }
.tb-logo{ display:flex; align-items:center; background:none; border:0; padding:.25rem; cursor:pointer; }
.tb-logo img{ height:42px; width:auto; display:block; }
.tb-spacer{ flex:1; }
.badge{ position:absolute; top:4px; right:4px; min-width:18px; height:18px; border-radius:9px; background:var(--accent); color:#111;
  font-size:.7rem; font-weight:700; display:grid; place-items:center; padding:0 4px; }
.bell{ position:relative; }
.user-btn{ gap:.6rem; }
.avatar{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.16); display:grid; place-items:center; font-family:var(--f-display); font-size:.85rem; }
.pop{ position:absolute; top:60px; right:1rem; width:min(360px, calc(100vw - 2rem)); background:var(--surface); color:var(--fg);
  border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 40px rgba(10,20,40,.22); padding:.5rem; z-index:40; }
.pop h2{ font-size:1rem; padding:.5rem .6rem; }
.pop-item{ display:flex; gap:.6rem; align-items:flex-start; width:100%; text-align:left; background:none; border:0; padding:.6rem; border-radius:8px; cursor:pointer; }
.pop-item:hover{ background:var(--surface-2); }
.pop-item small{ color:var(--muted); display:block; }
.pop-sep{ border-top:1px solid var(--line); margin:.35rem 0; }
.empty{ color:var(--muted); padding:.75rem .6rem; }

/* Menú lateral */
.drawer{ position:fixed; inset:0; z-index:50; display:flex; }
.drawer .scrim{ position:absolute; inset:0; background:var(--overlay); }
.drawer .panel{ position:relative; background:var(--surface); width:min(340px, 88vw); height:100%; overflow:auto; padding:1rem;
  padding-top:calc(1rem + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:.25rem; animation:slideIn .18s ease-out; }
@keyframes slideIn{ from{ transform:translateX(-20px); opacity:.6 } }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.5rem; }
.nav-item{ display:flex; align-items:center; gap:.75rem; width:100%; padding:.7rem .75rem; border-radius:8px; border:0; background:none; cursor:pointer; text-align:left; min-height:44px; }
.nav-item:hover{ background:var(--surface-2); }
.nav-item[aria-current="page"]{ background:var(--primary-soft); font-weight:700; }
.nav-item .chip{ margin-left:auto; }

/* Contenido */
main{ max-width:1120px; margin:0 auto; padding-inline:1rem; padding-block:1rem calc(5.5rem + env(safe-area-inset-bottom,0px)); }
.crumbs{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; color:var(--muted); font-size:.92rem; margin-bottom:1rem; min-height:44px; }
.crumbs ol{ display:flex; flex-wrap:wrap; gap:.35rem; list-style:none; margin:0; padding:0; }
.crumbs li{ display:flex; align-items:center; gap:.35rem; }
.crumbs li+li::before{ content:"›"; color:var(--muted); }
.crumbs .lnk{ background:none; border:0; padding:.15rem .1rem; color:var(--info); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.back{ display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:.3rem .65rem .3rem .4rem; cursor:pointer; min-height:34px; font-size:.9rem; color:var(--fg); font-weight:700; }
.page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.25rem; }
.page-head .sub{ color:var(--muted); margin-top:.3rem; }
.eyebrow{ font-size:.875rem; color:var(--muted); font-weight:400; margin-bottom:.3rem; }
.row{ display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1.25rem; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-height:40px; padding:.45rem 1rem; border-radius:8px; font-size:.95rem;
  font-weight:700; cursor:pointer; border:1.5px solid transparent; text-decoration:none; white-space:nowrap; }
.btn-primary{ background:var(--primary); color:var(--on-primary); }
.btn-primary:hover{ filter:brightness(1.12); }
.btn-secondary{ background:var(--surface); color:var(--fg); border-color:var(--line); }
.btn-secondary:hover{ background:var(--surface-2); }
.btn-danger{ background:var(--bad); color:#fff; }
.btn-danger-outline{ background:transparent; color:var(--bad); border-color:currentColor; }
.btn-danger-outline:hover{ background:var(--bad-bg); }
.btn-sm{ min-height:32px; padding:.25rem .7rem; font-size:.86rem; gap:.3rem; }
.btn-sm svg.i{ width:1.05em; height:1.05em; }

.chip{ display:inline-flex; align-items:center; gap:.45rem; padding:.16rem .6rem; border-radius:999px; font-size:.84rem; font-weight:600; white-space:nowrap;
  background:var(--surface); color:var(--fg); border:1px solid var(--line); }
.cdot{ width:8px; height:8px; border-radius:50%; flex:none; }
.k-ok{ background:#2F9E62; } .k-info{ background:#2F6FC4; } .k-warn{ background:#D9901A; } .k-muted{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--muted); }
.chip.k-txt-muted{ color:var(--muted); }

.prog{ display:flex; align-items:center; gap:.6rem; min-width:120px; }
.prog .bar{ flex:1; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
.prog .bar span{ display:block; height:100%; background:var(--primary); border-radius:4px; }
.prog .bar span.full{ background:var(--primary); }
.prog b{ font-variant-numeric:tabular-nums; min-width:3em; text-align:right; }

/* Inicio */
.hero{ display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; margin:.5rem 0 1.75rem; }
.hero img{ height:88px; width:auto; }
.hero .txt{ flex:1; min-width:16rem; display:flex; flex-direction:column; gap:.4rem; }
.hero h1{ font-size:2rem; }
.hero p{ color:var(--muted); max-width:62ch; font-size:1.05rem; }
.title-row{ display:flex; align-items:center; gap:.5rem; }
.info-wrap{ position:relative; display:inline-flex; }
.info-btn{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); color:var(--primary); display:grid; place-items:center; cursor:pointer; }
.info-btn:hover, .info-btn[aria-expanded="true"]{ background:var(--primary-soft); border-color:var(--primary); }
.info-btn svg.i{ width:18px; height:18px; }
.tip{ position:absolute; top:calc(100% + 8px); left:-.5rem; width:min(400px, calc(100vw - 2rem)); background:var(--surface); color:var(--fg); border:1px solid var(--line);
  border-radius:10px; box-shadow:0 12px 32px rgba(10,20,40,.16); padding:.85rem 1rem; z-index:20; font-size:.95rem; line-height:1.5; display:none; }
.info-wrap:hover .tip, .info-btn[aria-expanded="true"] + .tip{ display:block; }
.mod-head{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.75rem; flex-wrap:wrap; }
.tiles{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:1rem; }
.tile{ display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto 1fr; column-gap:.85rem; row-gap:.2rem; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem; cursor:pointer; min-height:120px; }
.tile:hover{ border-color:var(--primary); box-shadow:0 4px 14px rgba(20,40,80,.08); }
.tile .ic{ grid-row:1 / span 3; width:44px; height:44px; border-radius:10px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary); }
.tile .ic svg.i{ width:24px; height:24px; }
.tile strong{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; }
.tile span.d{ color:var(--muted); font-size:.92rem; }
.tile .chip{ justify-self:start; align-self:end; margin-top:.4rem; }

/* Aviso discreto */
.notice{ display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.5rem .5rem .5rem .65rem; margin-bottom:1.25rem; }
.notice p{ flex:1; min-width:12rem; }
.n-ic{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary); flex:none; }
.n-ic svg.i{ width:18px; height:18px; }
.notice.ok .n-ic{ background:var(--ok-bg); color:var(--ok); }
.n-link{ display:inline-flex; align-items:center; gap:.15rem; background:none; border:0; color:var(--info); font-weight:400; text-decoration:underline; text-underline-offset:3px; padding:.35rem .5rem; border-radius:8px; cursor:pointer; min-height:34px; font-size:.92rem; }
.n-link:hover{ background:var(--primary-soft); }

/* Tablas → tarjetas en celular */
.tbl-wrap{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto; }
table{ width:100%; border-collapse:collapse; }
th, td{ padding:.8rem 1rem; text-align:left; vertical-align:middle; border-bottom:1px solid var(--line); }
th{ font-family:var(--f-display); font-weight:600; font-size:.88rem; color:var(--muted); background:var(--surface-2); white-space:nowrap; }
tr:last-child td{ border-bottom:0; }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
tr.clickable{ cursor:pointer; }
tr.clickable:hover td{ background:color-mix(in srgb, var(--primary-soft) 55%, transparent); }
.row-title{ font-weight:700; color:var(--fg); background:none; border:0; padding:0; text-align:left; cursor:pointer; }
.row-title:hover{ text-decoration:underline; }
.muted{ color:var(--muted); font-size:.9rem; }
tr.annulled td{ color:var(--muted); }
tr.annulled .pct{ text-decoration:line-through; }
.td-actions{ text-align:right; white-space:nowrap; }
@media (max-width: 760px){
  .stacked thead{ display:none; }
  .stacked, .stacked tbody, .stacked tr, .stacked td{ display:block; width:100%; }
  .stacked tr{ border-bottom:1px solid var(--line); padding:.6rem 0; }
  .stacked td{ border:0; padding:.3rem 1rem; display:flex; justify-content:space-between; gap:1rem; text-align:right; }
  .stacked td::before{ content:attr(data-label); color:var(--muted); font-size:.85rem; font-weight:700; text-align:left; }
  .stacked td.td-main{ display:block; text-align:left; font-size:1.05rem; }
  .stacked td.td-main::before{ display:none; }
  .stacked td.td-actions{ justify-content:flex-start; padding-top:.6rem; }
  .stacked td.td-actions::before{ display:none; }
  .stacked .prog{ min-width:140px; }
}

.toolbar{ display:flex; gap:.75rem; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; margin-bottom:1rem; }
.search{ flex:1 1 260px; max-width:420px; }
.search .box{ position:relative; }
.search .box svg{ position:absolute; left:.7rem; top:50%; transform:translateY(-50%); color:var(--muted); }
.search .box input{ width:100%; padding-left:2.5rem; }
input[type=text], input[type=number], input[type=search], select, textarea{
  background:var(--surface); border:1.5px solid var(--muted); border-radius:8px; padding:.6rem .75rem; min-height:44px; width:100%; }
::placeholder{ color:var(--muted); opacity:.85; }
textarea{ min-height:96px; resize:vertical; }
input:focus, textarea:focus{ outline:3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset:1px; border-color:var(--primary); }
[aria-invalid="true"]{ border-color:var(--bad)!important; }

/* Campo de fecha con formato dd mes aaaa */
.datefield{ position:relative; }
.datefield .shown{ padding-right:2.6rem; cursor:pointer; }
.datefield .cal{ position:absolute; right:.75rem; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.datefield input[type=date]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; }
.datefield:focus-within .shown{ outline:3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset:1px; border-color:var(--primary); }
.datefield.invalid .shown{ border-color:var(--bad); }

/* Ficha: acordeón */
.summary-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1rem 1.5rem; }
.kv dt{ font-size:.875rem; color:var(--muted); font-weight:400; margin-bottom:.2rem; }
.kv dd{ margin:0; font-weight:700; }
.kv{ margin:0; }
.fx{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:1.5rem; align-items:start; }
.secnav{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:.6rem; position:sticky; top:1rem; }
.secnav-t{ margin:.2rem .5rem .5rem; font-size:.8125rem; font-weight:600; color:var(--muted); }
.secnav [role=tablist]{ display:flex; flex-direction:column; gap:2px; position:relative; }
.sec-tab{ position:relative; display:flex; justify-content:space-between; align-items:center; gap:.5rem; width:100%; padding:.55rem .7rem; border:0; border-left:3px solid transparent; border-radius:6px; background:none; font:inherit; font-size:.95rem; color:var(--fg); text-align:left; cursor:pointer; }
.sec-tab:hover{ background:var(--surface-2); }
.sec-tab[aria-selected="true"]{ background:var(--primary-soft); border-left-color:var(--primary); font-weight:600; }
.sec-st{ display:inline-flex; align-items:center; font-size:.8125rem; white-space:nowrap; }
.sec-st svg.i{ width:15px; height:15px; } .sec-ok{ color:var(--ok); } .sec-warn{ color:var(--warn); font-weight:600; }
.secpanel{ min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1.1rem 1.25rem; }
.sec-h{ font-family:var(--f-display); font-size:1.15rem; margin:0 0 .75rem; }
.secpanel .page-head{ margin-bottom:.75rem; }
@media (max-width: 760px){
  .fx{ grid-template-columns:minmax(0,1fr); gap:1rem; } .fx > *{ min-width:0; }
  .secnav{ position:static; padding:.4rem; }
  .secnav [role=tablist]{ flex-direction:row; overflow-x:auto; gap:.3rem; }
  .sec-tab{ width:auto; white-space:nowrap; border-left:0; border-bottom:3px solid transparent; border-radius:6px 6px 0 0; }
  .sec-tab[aria-selected="true"]{ border-bottom-color:var(--primary); }
  .secpanel{ padding:.9rem; }
}
.acc-tools{ display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.75rem; flex-wrap:wrap; }
.accs{ display:flex; flex-direction:column; gap:.6rem; }
details.acc{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
details.acc[open]{ border-color:color-mix(in srgb, var(--primary) 40%, var(--line)); }
details.acc > summary{ list-style:none; display:flex; align-items:center; gap:.85rem; padding:1rem; cursor:pointer; min-height:72px; border-radius:var(--r); }
details.acc > summary::-webkit-details-marker{ display:none; }
details.acc > summary:hover{ background:color-mix(in srgb, var(--primary-soft) 45%, transparent); }
details.acc > summary .txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:.1rem; }
details.acc > summary strong{ font-family:var(--f-display); font-weight:600; }
details.acc > summary .txt span{ color:var(--muted); font-size:.92rem; }
details.acc > summary .chev{ color:var(--muted); transition:transform .15s; }
details.acc[open] > summary .chev{ transform:rotate(90deg); }
.acc-body{ padding:0 1rem 1.1rem; border-top:1px solid var(--line); padding-top:1rem; }
.def{ display:grid; grid-template-columns:minmax(120px, 200px) 1fr; gap:.8rem 1.5rem; margin:0; }
.def dt{ font-weight:700; color:var(--muted); }
.def dd{ margin:0; max-width:65ch; }
@media (max-width: 560px){ .def{ grid-template-columns:1fr; gap:.2rem; } .def dd{ margin-bottom:.7rem; } }
.mini{ width:100%; border-collapse:collapse; }
.mini th, .mini td{ padding:.55rem .6rem; border-bottom:1px solid var(--line); background:none; font-size:.95rem; }
.mini th{ font-size:.82rem; }
.mini tr:last-child td{ border-bottom:0; }
.mini-wrap{ overflow-x:auto; }
.acc-foot{ margin-top:1rem; }
.ex{ font-size:.82rem; color:var(--muted); margin-top:.75rem; font-style:italic; }

/* Barra inferior */
.bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); }
.bb-inner{ max-width:1120px; margin:0 auto; padding-inline:1rem; display:flex; align-items:center; justify-content:center; gap:1rem; min-height:58px; }
.bb-tabs{ display:flex; gap:.25rem; }
.tab{ display:inline-flex; align-items:center; gap:.4rem; background:none; border:0; padding:.5rem .8rem; border-radius:8px; cursor:pointer; min-height:44px; color:var(--muted); font-weight:700; font-size:.9rem; position:relative; }
.tab:hover{ background:var(--surface-2); color:var(--fg); }
.tab[aria-current="page"]{ color:var(--primary); background:var(--primary-soft); }
.tab .badge{ top:2px; right:2px; }
@media (max-width: 760px){
  .bb-inner{ padding-inline:.25rem; }
  .bb-tabs{ width:100%; justify-content:space-around; }
  .tab{ flex-direction:column; gap:.1rem; font-size:.8125rem; padding:.35rem .3rem; flex:1; }
  .user-name, .tb-btn .lbl{ display:none; }
  .tb-logo img{ height:34px; }
  h1{ font-size:1.45rem; }
  .hero h1{ font-size:1.6rem; }
  .hero img{ height:64px; }
}

/* Ventanas */
.overlay{ position:fixed; inset:0; z-index:60; background:var(--overlay); display:grid; place-items:center; padding:1rem; overflow-y:auto; }
.dialog{ background:var(--surface); color:var(--fg); border-radius:14px; width:min(560px, 100%); box-shadow:0 24px 60px rgba(0,0,0,.3); animation:pop .16s ease-out; max-height:calc(100dvh - 2rem); overflow:auto; }
.dialog.wide{ width:min(640px, 100%); }
@keyframes pop{ from{ transform:translateY(8px) scale(.98); opacity:.6 } }
.dlg-head{ display:flex; align-items:flex-start; gap:.75rem; padding:1.25rem 1.25rem .5rem; }
.dlg-head .ic{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none; }
.dlg-head .ic svg.i{ width:22px; height:22px; }
.ic.warn{ background:var(--warn-bg); color:var(--warn); } .ic.ok{ background:var(--ok-bg); color:var(--ok); } .ic.bad{ background:var(--bad-bg); color:var(--bad); } .ic.info{ background:var(--info-bg); color:var(--info); }
.dlg-head h2{ flex:1; padding-top:.45rem; font-size:1.2rem; }
.x{ background:none; border:0; width:44px; height:44px; border-radius:8px; display:grid; place-items:center; cursor:pointer; color:var(--muted); margin:-.4rem -.4rem 0 0; }
.x:hover{ background:var(--surface-2); color:var(--fg); }
.dlg-body{ padding:.25rem 1.25rem 1rem; display:flex; flex-direction:column; gap:1rem; }
.dlg-body > p{ max-width:60ch; }

const acum = p => Math.round(active(p).reduce((a,h) => a + h.pct, 0) * 10) / 10;
const chrono = p => p.hist.map((h,i) => ({h,i})).sort((a,b) => a.h.date < b.h.date ? -1 : a.h.date > b.h.date ? 1 : a.i - b.i).map(x => x.h);
const lastA = p => { const a = chrono(p).filter(h => !h.annulled); return a[a.length-1]; };
/* Estado automático: depende solo del acumulado */
const estadoP = p => { const a = acum(p); return a <= 0 ? 'Sin iniciar' : a >= 100 ? 'Finalizado' : 'En curso'; };

/* Búsqueda sin tildes y tolerante a un error de una letra */
const norm = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function lev(a, b){
  const d = Array.from({ length:a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function fuzzy(text, query){
  const q = norm(query); if (!q) return true;
  const t = norm(text); if (t.includes(q)) return true;
  const words = t.split(/[^a-z0-9]+/).filter(Boolean);
  return q.split(/\s+/).every(w => words.some(x => x.includes(w) || (w.length >= 4 && (lev(x, w) <= 1 || lev(x.slice(0, w.length), w) <= 1))));
}

let lastFocus = null;
function closeLayer(){ const l = $('#layer'); if (l.innerHTML){ l.innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); } }
function trap(root){
  root.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.preventDefault(); closeLayer(); return; }
    if (e.key !== 'Tab') return;
    const f = [...root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  });
}
function modal({tone='info', icon='info', title, body, actions=[], wide, focus, autosave}){
  if (!$('#layer').innerHTML) lastFocus = document.activeElement;
  $('#layer').innerHTML = `<div class="overlay"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-b">
    <div class="dlg-head"><span class="ic ${tone}">${ic(icon)}</span><h2 id="dlg-t">${title}</h2><button class="x" data-close="1" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="dlg-body" id="dlg-b">${body}</div>
    ${actions.length?`<div class="dlg-foot">${autosave?'<span class="autosave" id="as-status" aria-live="polite"></span>':''}${actions.map((a,i)=>`<button class="btn btn-${a.kind||'secondary'}" data-ai="${i}">${a.label}</button>`).join('')}</div>`:''}
  </div></div>`;
  const ov = $('#layer .overlay');
  trap(ov);
  ov.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || e.target === ov) { closeLayer(); return; }
    const b = e.target.closest('[data-ai]');
    if (b){ const a = actions[+b.dataset.ai]; const r = a.onClick ? a.onClick() : undefined; if (r === undefined) closeLayer(); }
  });
  setTimeout(() => {
    const el = (focus && $(focus, ov)) || ov.querySelector('.dlg-body textarea, .dlg-body input:not([type=date]), .dlg-body input') || ov.querySelector('.btn-primary, .btn-danger') || ov.querySelector('.x');
    el && el.focus();
  }, 20);
  return ov;
}

      <details><summary>Me equivoqué al registrar. ¿Cómo lo corrijo?</summary><p>Justo después de guardar puedes pulsar "Deshacer" durante 10 segundos. Después, abre el producto, busca el registro en el historial y pulsa "Corregir": escribes el motivo y el valor correcto en el mismo paso. El registro equivocado queda tachado, con el motivo, y deja de sumar.</p></details>
      <details><summary>¿Por qué no puedo registrar más avance?</summary><p>El acumulado de un producto no puede superar 100 %. Si ya está completo, corrige o anula un registro anterior.</p></details>
    </div>`,
    actions:[ { label:'Cerrar', kind:'primary' } ] });
}

/* ---------- Registrar avance ---------- */
function regForm(pid, pre, noDraft){
  const p = prod(pid); const base = acum(p); const max = Math.round((100 - base)*10)/10;
  if (max <= 0){
    modal({ tone:'info', icon:'check', title:'Este producto ya está al 100%',
      body:`<p><b>${esc(p.name)}</b> está finalizado. Para registrar un nuevo avance, primero anula uno de los registros en el historial.</p>`,
      actions:[ { label:'Cerrar' }, { label:'Ver historial', kind:'primary', onClick:() => { showProduct(p.id); return true; } } ] });
    return;
  }
  const key = 'reg-'+pid;
  const dn = (pre || noDraft) ? { d:null, html:'' } : draftNote(key);
  const v = Object.assign({ date:TODAY, pct:'', comment:'' }, pre||{});
  if (dn.d){ v.date = dn.d['f-date'] || v.date; v.pct = dn.d['f-pct'] || ''; v.comment = dn.d['f-com'] || ''; }
  const ov = modal({ tone:'info', icon:'plus', title:'Registrar avance', wide:true, autosave:true,
    body:`${dn.html}<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(base)}</dd><dt>Estado</dt><dd>${estadoP(p)}</dd></dl>
    <form id="regf" novalidate style="display:flex;flex-direction:column;gap:1rem">
      <div class="form-grid">
        <div class="field"><label for="f-date">Fecha del avance</label>
          <span class="hint" id="h-date">Entre ${fd(PER_INI)} y hoy, ${fd(TODAY)}.</span>
          ${dateField('f-date', v.date, PER_INI, TODAY, TODAY)}
          <span class="err" id="e-date" hidden></span></div>
        ${pctField(base, max, v.pct)}
      </div>
      <div class="field"><label for="f-com">Comentario</label>
        <span class="hint" id="h-com">Mínimo 5 caracteres.</span>
        <textarea id="f-com" maxlength="300" data-def="" placeholder="Describe qué se hizo en este periodo" required aria-describedby="h-com e-com">${esc(v.comment)}</textarea>
        <span class="err" id="e-com" hidden></span></div>
    </form>`,
    actions:[ { label:'Cancelar' }, { label:'Guardar avance', kind:'primary', onClick:() => submitReg(pid) } ] });
  wireDate(ov, 'f-date'); wirePct(ov, base, max);
  $('#regf', ov).addEventListener('submit', e => { e.preventDefault(); submitReg(pid); });
  bindAutosave(ov, key, ['f-date','f-pct','f-com']);
  const disc = $('[data-discard]', ov);
  if (disc) disc.addEventListener('click', () => { store.del(DRAFT+key); regForm(pid, null, true); });
  if (pre && pre.focusPct) setTimeout(() => { const f = $('#f-pct'); f && (f.focus(), f.select()); }, 40);
  if (pre) bindAutosave.touch = setTimeout(() => $('#f-com', ov).dispatchEvent(new Event('input', { bubbles:true })), 50);
}
function submitReg(pid){
  const p = prod(pid); const base = acum(p); const max = Math.round((100 - base)*10)/10;
  const v = { date:$('#f-date').value, pct:$('#f-pct').value.trim(), comment:$('#f-com').value.trim() };
  const n = parseFloat(v.pct.replace(',', '.')); const tot = Math.round((base + (n||0))*10)/10;
  let first = null; const bad = (id, msg) => { setErr(id, msg); if (msg && !first) first = id; };
  bad('date', !v.date ? 'Elige la fecha del avance.' : v.date < PER_INI ? `La fecha debe ser desde el ${fd(PER_INI)}, inicio del proyecto.` : v.date > TODAY ? `La fecha no puede ser posterior a hoy (${fd(TODAY)}).` : '');
  bad('pct', !v.pct ? 'Escribe el porcentaje de avance.' : (isNaN(n) || n <= 0) ? 'Escribe un número mayor que 0.' : n > max ? `El máximo que puedes registrar es ${pctf(max)}. Con ${pctf(n)} el acumulado llegaría a ${pctf(tot)}.` : '');
  bad('com', !v.comment ? 'Escribe un comentario sobre el avance.' : v.comment.length < 5 ? 'Amplía el comentario (mínimo 5 caracteres).' : '');
  if (first){ $('#f-'+first).focus(); return false; }
  if (navigator.onLine === false){ toast('Sin conexión. Tu avance quedó guardado como borrador en este equipo; guárdalo cuando vuelva la conexión.'); return false; }
  const save = () => {
    const antes = estadoP(p);
    const nuevo = { id:nid(), date:v.date, pct:n, by:ME, comment:v.comment };
    p.hist.push(nuevo); S.lastReg = { pct:n, name:p.name };
    store.del(DRAFT+'reg-'+pid);
    const despues = estadoP(p);
    render();
    let left = 10, tick = null;
    const ovc = modal({ tone:'ok', icon:'check', title:'Avance registrado',
      body:`<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Avance</dt><dd>+${pctf(n)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(acum(p))}</dd><dt>Estado</dt><dd>${despues}${antes !== despues ? ` (antes: ${antes})` : ''}</dd></dl>
        <p class="undo-note" id="undo-note" aria-live="polite">${ic('clock')}<span>Puedes deshacer este registro durante <b id="undo-s">10</b> segundos.</span></p>`,
      actions:[ { label:'Deshacer', onClick:() => {
          if (left <= 0 || nuevo.annulled) return false;
          clearInterval(tick);
          S.lastReg = null; nuevo.annulled = { by:ME, date:REAL_TODAY, reason:'Deshecho por quien lo registró, justo después de guardarlo' };
          render();
          modal({ tone:'info', icon:'history', title:'Registro deshecho',
            body:`<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(acum(p))}</dd><dt>Estado</dt><dd>${estadoP(p)}</dd></dl>
              <p class="muted">El registro queda en el historial como anulado, para conservar la trazabilidad.</p>`,
            actions:[ { label:'Registrar de nuevo', onClick:() => { regForm(p.id, { date:nuevo.date, pct:String(nuevo.pct), comment:nuevo.comment, focusPct:true }); return true; } }, { label:'Aceptar', kind:'primary' } ] });
          return true; } },
        { label:'Ver historial', onClick:() => { clearInterval(tick); showProduct(p.id); return true; } },
        { label:'Aceptar', kind:'primary' } ] });
    tick = setInterval(() => {
      left -= 1; const sEl = $('#undo-s', ovc), note = $('#undo-note', ovc), btn = $('[data-ai="0"]', ovc);
      if (!sEl || !document.contains(ovc)) { clearInterval(tick); return; }
      if (left > 0) { sEl.textContent = left; return; }
      clearInterval(tick); btn.disabled = true; btn.setAttribute('aria-disabled','true');
      note.innerHTML = `${ic('info')}<span>Ya no se puede deshacer. Si hay un error, usa "Corregir" en el historial.</span>`;
    }, 1000);
  };
  if (n >= UMBRAL_ALTO){
    modal({ tone:'warn', icon:'alert', title:'Avance muy alto',
      body:`<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Avance</dt><dd>+${pctf(n)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(base)} → ${pctf(tot)}</dd></dl><p>¿Es correcto?</p>`,
      actions:[ { label:'Volver a editar', onClick:() => { regForm(pid, Object.assign({ focusPct:true }, v)); return true; } },
                { label:'Sí, es correcto', kind:'primary', onClick:() => { save(); return true; } } ],
      focus:'[data-ai="0"]' });
    return true;
  }
  save(); return true;
}

/* ---------- Anular (cualquier integrante) ---------- */
function anular(hid){
  const p = S.products.find(x => x.hist.some(h => h.id === hid)); const h = p.hist.find(x => x.id === hid);
  const base = acum(p); const key = 'anular-'+hid; const dn = draftNote(key);
  const otro = h.by !== ME;
  const ov = modal({ tone:'bad', icon:'alert', title:'Anular avance', autosave:true,
    body:`${dn.html}<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Avance</dt><dd>+${pctf(h.pct)} del ${fd(h.date)}</dd><dt>Registrado por</dt><dd>${esc(h.by)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(base)} → ${pctf(base - h.pct)}</dd></dl>
      <p>El registro no se borra: queda en el historial como anulado, con tu nombre, la fecha y el motivo, y deja de sumar.${otro ? ` Le avisaremos a ${esc(h.by)}.` : ''}</p>
      <div class="field"><label for="f-mot">Motivo de la anulación</label>
      <textarea id="f-mot" maxlength="250" data-def="" placeholder="Ej.: error de digitación, el valor correcto es 8%" aria-describedby="e-mot">${esc(dn.d ? dn.d['f-mot'] : '')}</textarea><span class="err" id="e-mot" hidden></span></div>`,
    actions:[ { label:'Cancelar' }, { label:'Anular avance', kind:'danger', onClick:() => {
      const r = $('#f-mot').value.trim();
      if (r.length < 5){ setErr('mot', r ? 'Amplía el motivo (mínimo 5 caracteres).' : 'Escribe el motivo de la anulación.'); $('#f-mot').focus(); return false; }
      const antes = estadoP(p);
      h.annulled = { by:ME, date:REAL_TODAY, reason:r }; store.del(DRAFT+key);
      const despues = estadoP(p);
      render();
      modal({ tone:'ok', icon:'check', title:'Avance anulado',
        body:`<dl class="ctx"><dt>Proyecto</dt><dd>Participación comunitaria de jóvenes rurales</dd><dt>Producto</dt><dd>${esc(p.name)}</dd><dt>Avance anulado</dt><dd>+${pctf(h.pct)}</dd><dt>Porcentaje acumulado</dt><dd>${pctf(acum(p))}</dd><dt>Estado</dt><dd>${despues}${antes !== despues ? ` (antes: ${antes})` : ''}</dd></dl>
          ${otro ? `<p class="muted">Avisamos a ${esc(h.by)} que su avance fue anulado.</p>` : ''}
          <p>¿Quieres registrar el avance de nuevo? El formulario se abrirá con los datos anteriores para que los corrijas.</p>`,
        actions:[ { label:'Más tarde' }, { label:'Registrar de nuevo', kind:'primary', onClick:() => { regForm(p.id, { date:h.date, pct:String(h.pct), comment:h.comment, focusPct:true }); return true; } } ] });
      return true;
    } } ] });
  bindAutosave(ov, key, ['f-mot']);
  const disc = $('[data-discard]', ov); if (disc) disc.addEventListener('click', () => { store.del(DRAFT+key); anular(hid); });
}

      <div class="form-grid">
        <div class="field"><label for="f-mrol">Rol</label><select id="f-mrol" aria-describedby="e-mrol"><option value="">Elige un rol</option>${ROLES.map(r => `<option>${r}</option>`).join('')}</select><span class="err" id="e-mrol" hidden></span></div>
        <div class="field"><label for="f-mded">Dedicación</label><input id="f-mded" type="text" maxlength="30" placeholder="Ej.: 10 h/semana" aria-describedby="e-mded"><span class="err" id="e-mded" hidden></span></div>
      </div>
      <div><button type="button" class="btn btn-secondary" id="madd">${ic('plus')}Agregar a la lista</button></div>`,
    actions:[ { label:'Cancelar' }, { label:'Guardar cambios', kind:'primary', onClick:() => {
      S.proj.team = work; S.params.open = 'team'; render(); toast('Integrantes actualizados.'); return undefined; } } ] });
  const draw = () => {
    $('#mlist', ov).innerHTML = work.map((m,i) => `<div class="member"><div class="grow"><b>${esc(m.name)}</b>${m.name===ME?' <span class="muted">(tú)</span>':''}<small>${esc(m.rol)} · ${esc(m.ded)}</small></div>
      ${m.name===ME ? '' : `<button type="button" class="btn btn-danger-outline btn-sm" data-mdel="${i}" aria-label="Quitar a ${esc(m.name)}">Quitar</button>`}</div>`).join('');
  };
  draw();
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-mdel]'); if (!b) return;
    const m = work[+b.dataset.mdel];
    const n = S.products.filter(p => !p.retired && p.resp === m.name).length;
    const em = $('#e-mlist', ov);
    if (n){ em.innerHTML = ic('alert') + `<span>No puedes quitar a ${esc(m.name)}: es responsable de ${plural(n,'producto activo','productos activos')}. Elimina esos productos o cambia su responsable primero.</span>`; em.hidden = false; return; }
    em.hidden = true; work.splice(+b.dataset.mdel, 1); draw();
  });
  $('#madd', ov).addEventListener('click', () => {
    const name = $('#f-mname').value.trim(), rol = $('#f-mrol').value, ded = $('#f-mded').value.trim();
    let first = null; const bad = (id, msg) => { setErr(id, msg); if (msg && !first) first = id; };
    bad('mname', name.length < 5 ? 'Escribe el nombre completo.' : work.some(m => m.name.toLowerCase() === name.toLowerCase()) ? 'Esta persona ya está en el equipo.' : '');
    bad('mrol', !rol ? 'Elige el rol.' : '');
    bad('mded', !ded ? 'Escribe la dedicación.' : '');
    if (first){ $('#f-'+first).focus(); return; }
    work.push({ name, rol, ded }); draw();
    ['f-mname','f-mded'].forEach(i => $('#'+i).value = ''); $('#f-mrol').value = '';
    toast(`${esc(name)} agregado a la lista. Guarda los cambios para confirmar.`);
  });
}
function requestChange(what){
  modal({ tone:'info', icon:'lock', title:'Solicitar cambio al administrador',
    body:`<p>${esc(what)} dependen del convenio del proyecto, por eso solo los cambia el administrador.</p>
      <div class="field"><label for="f-req">¿Qué cambio necesitas y por qué?</label>
      <textarea id="f-req" maxlength="300" placeholder="Ej.: ampliar el periodo hasta el 31 mar 2027 por prórroga aprobada" aria-describedby="e-req"></textarea><span class="err" id="e-req" hidden></span></div>`,
    actions:[ { label:'Cancelar' }, { label:'Enviar solicitud', kind:'primary', onClick:() => {
      const r = $('#f-req').value.trim();
      if (r.length < 5){ setErr('req', 'Describe el cambio que necesitas (mínimo 5 caracteres).'); $('#f-req').focus(); return false; }
      modal({ tone:'ok', icon:'check', title:'Solicitud enviada', body:`<p>Te avisaremos cuando el administrador la resuelva.</p>`, actions:[{ label:'Aceptar', kind:'primary' }] });
      return true; } } ] });
}

/* ---------- Menús ---------- */
function notifPop(){
  S.notif.forEach(n => n.read = true);
  const txt = n => n.corte ? (S.access === 'granted' && pendCount() ? `Tienes ${plural(pendCount(),'producto pendiente','productos pendientes')} de avance para el corte del ${fd(CORTE)} (${diasCorte().toLowerCase()}).` : `El corte de avances de octubre cierra el ${fd(CORTE)}.`) : n.text;
  pop(`<h2>Notificaciones</h2>${S.notif.length ? S.notif.map(n=>`<div class="pop-item">${ic('bell')}<span>${esc(txt(n))}${n.corte && S.access === 'granted' && pendCount() ? `<button class="n-link" data-go="products" style="padding-left:0;display:flex;min-height:32px">Ir a productos${ic('chev')}</button>` : ''}<small>${n.time}</small></span></div>`).join('') : '<p class="empty">No tienes notificaciones.</p>'}`, 'Notificaciones');
  renderTop(); renderBottom();
}
function userPop(){
  pop(`<h2>${ME}</h2><p class="empty" style="padding-top:0">Investigador</p><div class="pop-sep"></div>
    <button class="pop-item" data-act="a11y">${ic('a11y')}<span>Opciones de accesibilidad</span></button>
    <button class="pop-item" data-act="logout">${ic('logout')}<span>Cerrar sesión</span></button>`, 'Menú de usuario');
}
function navDrawer(){
  const inProj = ['projects','ficha','products'].includes(S.screen);
  drawer(`<div class="panel-head"><img src="${LOGO_C}" alt="CINDE" style="height:48px;width:auto"><button class="x" data-close="1" aria-label="Cerrar menú">${ic('x')}</button></div>
    <button class="nav-item" data-go="home" ${S.screen==='home'?'aria-current="page"':''}>${ic('home')}Inicio</button>
    <button class="nav-item" data-go="formats" ${S.screen==='formats'?'aria-current="page"':''}>${ic('clock')}Vista multiformato</button>
    ${MODULES.map(([id,t,,i]) => `<button class="nav-item" data-mod="${id}" ${(id==='projects' && inProj) || (S.screen==='module' && S.params.mod===id) ? 'aria-current="page"':''}>${ic(i)}${t}${id==='projects' && S.access!=='granted' ? chip(S.access==='none'?'muted':'warn', S.access==='none'?'Sin acceso':'En revisión', S.access==='none'?'lock':'clock') : ''}</button>`).join('')}`, 'Menú principal');
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-mod],[data-proj],[data-prod],[data-prodopen],[data-reg],[data-anular],[data-corregir],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.reg){ e.stopPropagation(); regForm(d.reg); return; }
  if (d.anular){ anular(d.anular); return; }
  if (d.corregir){ corregir(d.corregir); return; }
  if (d.go){ go(d.go); return; }
  if (d.mod){ if (d.mod === 'projects') go('projects'); else go('module', { mod:d.mod }); return; }
  if (d.proj){ if (d.proj === 'pr1') go('ficha'); else toast('En este prototipo solo está completo el proyecto “Participación comunitaria de jóvenes rurales”.'); return; }
  if (d.prod){ toggleProduct(d.prod); return; }
  if (d.prodopen){ showProduct(d.prodopen); return; }
  switch (d.act){
    case 'drawer': navDrawer(); break;
    case 'notif': notifPop(); break;
    case 'user': userPop(); break;
    case 'accopen': document.querySelectorAll('details.acc').forEach(x => x.open = true); break;
    case 'pexpand': S.params.exp = S.products.map(p => p.id); render(); { const b = $('[data-act="pcollapse"]'); b && b.focus(); } break;
    case 'pcollapse': S.params.exp = []; render(); { const b = $('[data-act="pexpand"]'); b && b.focus(); } break;
    case 'accclose': document.querySelectorAll('details.acc').forEach(x => x.open = false); break;
    case 'info': { const open = t.getAttribute('aria-expanded') === 'true'; t.setAttribute('aria-expanded', String(!open)); break; }
    case 'export': toast('Se generaría un archivo Excel con la lista de proyectos.'); break;
    case 'addprod': addProduct(); break;
    case 'faq': faq(); break;
    case 'wnext': S.params.w = ((S.params.w || 0) + 1) % 3; render(); { const w = $('.watch'); w && w.focus(); } break;
    case 'a11y': a11yPanel(); break;
    case 'why': { const o = t.getAttribute('aria-expanded') === 'true'; t.setAttribute('aria-expanded', String(!o)); const w = document.getElementById('why-'+t.dataset.pid); if (w) w.hidden = o; break; }
    case 'sec': { const v = t.dataset.sec; if (v === 'products') go('products'); else go('ficha', { sec:v }); const b = $('#tab-'+v); if (b) b.focus(); break; }
    case 'acctoggle': { const ds = [...document.querySelectorAll('details.acc')]; const open = ds.some(x => !x.open); ds.forEach(x => x.open = open); t.textContent = open ? 'Contraer todo' : 'Desplegar todo'; t.setAttribute('aria-pressed', String(open)); break; }
    case 'more': { const m = t.nextElementSibling; const open = !m.hidden; closeMenus(); if (!open){ m.hidden = false; t.setAttribute('aria-expanded','true'); const f = m.querySelector('button'); f && f.focus(); } break; }
    case 'showpend': S.params.pend = !S.params.pend; render(); { const f = $('[data-act="showpend"]'); f && f.focus(); } break;
    case 'delprod': deleteProduct(d.id); break;
    case 'editprod': editProduct(d.id); break;
    case 'reqchange': requestChange(d.what); break;
    case 'edit-general': editFields('general','Editar información general',[{k:'objetivo',label:'Objetivo',area:true},{k:'impacto',label:'Impacto esperado',area:true}]); break;
    case 'edit-groups': editFields('groups','Editar grupos de investigación',[{k:'grupo',label:'Grupo principal'},{k:'linea',label:'Línea'}]); break;
    case 'edit-orgs': editFields('orgs','Editar organizaciones beneficiarias',[{k:'orgs',label:'Organizaciones'},{k:'poblacion',label:'Población'}]); break;
    case 'edit-team': editTeam(); break;
    case 'logout': closeLayer(); toast('En el sistema real aquí se cerraría la sesión.'); break;
  }
});
document.addEventListener('click', e => { if (!e.target.closest('.info-wrap')) document.querySelectorAll('.info-btn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded','false')); }, true);
document.addEventListener('keydown', e => { const t = e.target; if (t.classList && t.classList.contains('sec-tab') && ['ArrowDown','ArrowUp','Home','End'].includes(e.key)){ e.preventDefault(); const tabs = [...document.querySelectorAll('.sec-tab')]; let k = tabs.indexOf(t); k = e.key==='Home' ? 0 : e.key==='End' ? tabs.length-1 : (k + (e.key==='ArrowDown'?1:-1) + tabs.length) % tabs.length; tabs[k].click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.info-btn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded','false')); });
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  const f = e.target; if (!f.id || f.getAttribute('aria-invalid') !== 'true') return;
  setErr(f.id.replace(/^f-/, ''), '');
}));
document.addEventListener('input', e => {
  const t = e.target; if (t.id !== 'qproj' && t.id !== 'qprod') return;
  S.params.q = t.value; const pos = t.selectionStart, id = t.id;
  $('#app').innerHTML = VIEWS[S.screen]();
  const n = $('#'+id); if (n){ n.focus(); n.setSelectionRange(pos,pos); }
});
function closeMenus(){ document.querySelectorAll('.more-menu').forEach(m => { m.hidden = true; const b = m.previousElementSibling; b && b.setAttribute('aria-expanded','false'); }); }
document.addEventListener('click', e => { if (!e.target.closest('.more') || e.target.closest('[role="menuitem"]')) closeMenus(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ const open = document.querySelector('.more-menu:not([hidden])'); if (open){ const b = open.previousElementSibling; closeMenus(); b && b.focus(); } } });
document.addEventListener('change', e => {
  if (e.target.id !== 'fpend') return;
  S.params.pend = e.target.checked; render(); const f = $('#fpend'); f && f.focus();
});
window.addEventListener('popstate', e => {
  const st = e.state; if (!st || !st.screen) return;
  const l = $('#layer'); if (l.innerHTML) l.innerHTML = '';
  go(st.screen, st.params || {}, true);
});
/* ---------- Opciones de accesibilidad (versión C) ---------- */
const A11Y_KEY = 'sii-accesibilidad';
const A11Y_DEF = { text:'normal', contrast:false, cvd:false, spacing:false, focus:false, motion:false };
let A11Y = Object.assign({}, A11Y_DEF, store.get(A11Y_KEY) || {});
function applyA11y(){
  const h = document.documentElement;
  h.classList.toggle('a11y-text-lg', A11Y.text === 'grande');
  h.classList.toggle('a11y-text-xl', A11Y.text === 'muy-grande');
  ['contrast','cvd','spacing','focus','motion'].forEach(k => h.classList.toggle('a11y-' + k, !!A11Y[k]));
  store.set(A11Y_KEY, A11Y);
}
function a11yPanel(){
  const sw = (k, t, d) => `<label class="a11y-opt"><input type="checkbox" role="switch" id="a11y-${k}" ${A11Y[k] ? 'checked' : ''}><span><b>${t}</b><small>${d}</small></span></label>`;
  const rd = (v, t) => `<label class="a11y-size"><input type="radio" name="a11y-text" value="${v}" ${A11Y.text === v ? 'checked' : ''}><span>${t}</span></label>`;
  const ov = modal({ tone:'info', icon:'a11y', title:'Opciones de accesibilidad', wide:true,
    body:`<p class="muted">Los cambios se aplican de inmediato y se guardan en este equipo.</p>
      <fieldset class="a11y-group"><legend>Tamaño del texto <small>Baja visión, presbicia</small></legend><div class="a11y-sizes">${rd('normal','Normal')}${rd('grande','Grande')}${rd('muy-grande','Muy grande')}</div></fieldset>
      ${sw('contrast','Alto contraste','Baja visión, cataratas, uso a pleno sol. Texto negro sobre blanco y bordes marcados.')}
      ${sw('cvd','Colores para daltonismo','Daltonismo rojo-verde. Cambia el verde por azul y agrega íconos a los estados, para no depender del color.')}
      ${sw('spacing','Más espacio entre líneas y letras','Baja visión, dislexia. Facilita seguir el texto.')}
      ${sw('focus','Resaltar el foco del teclado','Navegación con teclado y baja visión. Marca con un borde grueso el elemento activo.')}
      ${sw('motion','Reducir animaciones','Sensibilidad al movimiento o mareo. Quita transiciones y desplazamientos.')}
      <div class="notice" role="note"><span class="n-ic">${ic('info')}</span><p><b>Lectores de pantalla.</b> <span class="muted">El sistema funciona con VoiceOver (Mac y iPhone), NVDA (Windows) y TalkBack (Android): cada pantalla tiene título, los campos tienen etiquetas y los avisos se anuncian. No requiere activar ninguna opción.</span></p></div>`,
    actions:[ { label:'Restablecer', onClick:() => { A11Y = Object.assign({}, A11Y_DEF); applyA11y(); a11yPanel(); return true; } }, { label:'Cerrar', kind:'primary' } ] });
  ov.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'a11y-text') A11Y.text = t.value;
    else if (t.id && t.id.startsWith('a11y-')) A11Y[t.id.slice(5)] = t.checked;
    applyA11y();
  });
}
applyA11y();
try { history.replaceState({ screen:'home', params:{} }, '', '#home'); } catch(e){}
render();
})();
</script>
